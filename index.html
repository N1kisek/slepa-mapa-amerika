<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Slepá mapa Ameriky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: sticky tabs; map viewer is the hero of every mode; controls sit below it (phone) or beside it (desktop) */
:root{
  --bg:#000000; --surface:#111111; --ink:#f2f2f2; --muted:#8c8c8c;
  --accent:#ffffff; --accent-ink:#000000; --tag:#2a2a2a; --line:#262626;
  --hl:#ffd23f; --ok:#4ade80; --ok-bg:#0f2a19; --bad:#f87171; --bad-bg:#2c1212; --warn:#fbbf24; --warn-bg:#2b220c;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --gutter:16px; --radius:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-inline:max(var(--gutter), env(safe-area-inset-left,0px)) max(var(--gutter), env(safe-area-inset-right,0px));
  padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation}
.wrap{max-width:1240px;margin:0 auto}
header{padding-block:calc(22px + env(safe-area-inset-top,0px)) 10px}
h1{font:800 clamp(30px,6vw,46px)/1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font:600 12px/1.4 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;padding-block:10px;background:var(--bg)}
.tab{flex:1 1 0;max-width:210px;min-width:0;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--body);padding:10px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* category chips */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--muted);font:700 13px var(--body);padding:6px 11px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--tag)}
.chip.all{color:var(--ink)}

/* main grid */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{display:grid;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}

/* map */
.mapbox{position:relative;border-radius:var(--radius);overflow:hidden;background:#0b3d57;border:1px solid var(--line);height:min(78vh,820px);touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox svg{display:block;width:100%;height:100%;cursor:grab}
.mapbox.picking svg{cursor:crosshair}
.mapbox.dragging svg{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:2}
.zoom button{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.65);color:#fff;font:700 20px/1 var(--body);cursor:pointer;backdrop-filter:blur(4px)}
.maphint{position:absolute;left:10px;bottom:10px;z-index:2;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:5px 10px;border-radius:999px;pointer-events:none}
.hl-poly{fill:rgba(255,210,63,.38);stroke:var(--hl);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hl-line{fill:none;stroke:var(--hl);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hl-pt{fill:rgba(255,210,63,.3);stroke:var(--hl);stroke-width:3;vector-effect:non-scaling-stroke}
.hl-dot{fill:var(--hl);stroke:#000;stroke-width:1.5;vector-effect:non-scaling-stroke}
.ok .hl-poly,.ok .hl-pt{fill:rgba(74,222,128,.35);stroke:var(--ok)} .ok .hl-line{stroke:var(--ok)} .ok .hl-dot{fill:var(--ok)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.click-mark{fill:var(--bad);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.click-mark.good{fill:var(--ok)}
.lbl{font:700 13px var(--body);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.ov-shape{opacity:.9}
.ov-shape .hl-poly{fill:rgba(255,210,63,.18);stroke-width:1.5}
.ov-shape .hl-line{stroke-width:3.5}
.ov-shape .hl-pt{fill:rgba(255,210,63,.15);stroke-width:1.5}

/* quiz panel */
.bar{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q-cat{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prompt{font:800 clamp(24px,4vw,34px)/1.1 var(--display);text-wrap:balance;margin:0}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1 1 200px;min-width:0;font:700 19px var(--body);padding:12px 14px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.answer input:disabled{opacity:.85}
.btn{font:700 16px var(--body);padding:12px 14px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"idk idk" "prev next";gap:8px}
.nav .idk{grid-area:idk}.nav .prev{grid-area:prev}.nav .next{grid-area:next}
.feedback{border-radius:12px;padding:12px 14px;font-weight:700}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback.warn{background:var(--warn-bg);color:var(--warn)}
.feedback .correct{display:block;font:800 22px/1.2 var(--display);margin-top:2px;color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{font-size:14px;padding:8px 12px;min-height:40px}
.done{text-align:center}
.done h2{font:800 40px/1 var(--display);margin:4px 0}
.done p{color:var(--muted);margin:0}

/* overview list */
.search{width:100%;font:16px var(--body);padding:11px 14px;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.list{max-height:min(60vh,600px);overflow:auto;display:grid;gap:14px;padding-right:4px}
.list h3{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.list ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.list li button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 14px var(--body);padding:6px 10px;border-radius:8px;cursor:pointer;text-align:left}
.list li button[aria-current="true"]{background:var(--hl);color:#000;border-color:var(--hl)}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;cursor:pointer;min-height:36px}
.toggle input{width:18px;height:18px}
.sel-name{font:800 26px/1.15 var(--display);margin:0;text-wrap:balance}
.sel-cat{color:var(--muted);font-size:14px}

.sig{text-align:center;color:var(--muted);font:700 11px/1 var(--body);letter-spacing:.3em;padding-block:40px 8px;opacity:.6}

@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .mapbox{height:min(62vh,640px)}
  .list{max-height:none}
}
@media (max-width:560px){
  header{padding-block:calc(14px + env(safe-area-inset-top,0px)) 4px}
  .tab{max-width:none;font-size:14px;padding:9px 4px}
  .mapbox{height:46vh;min-height:300px;border-radius:14px}
  .card{padding:12px}
  .answer input{flex-basis:100%;font-size:18px}
  .answer .btn{flex:1 1 100%}
  .chip{font-size:12px;padding:5px 9px}
}
@media (max-height:520px) and (orientation:landscape){
  header{display:none}
  .stage{grid-template-columns:minmax(0,1fr) 300px}
  .mapbox{height:calc(100dvh - 90px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1><small>Slepá mapa · Severní a Jižní Amerika</small>Slepá mapa Ameriky</h1></header>

  <nav class="tabs" role="tablist">
    <button class="tab" id="tab-what" role="tab" aria-selected="true">Co to je?</button>
    <button class="tab" id="tab-find" role="tab" aria-selected="false">Najdi na mapě</button>
    <button class="tab" id="tab-atlas" role="tab" aria-selected="false">Přehled</button>
  </nav>

  <div class="cats" id="cats" role="group" aria-label="Kategorie"></div>

  <div class="stage">
    <div class="mapbox" id="mapbox">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Slepá mapa Ameriky">
        <image id="mapimg" href="mapa.jpg" x="0" y="0"></image>
        <g id="overlay"></g>
        <g id="hl"></g>
        <g id="marks"></g>
        <g id="labels"></g>
      </svg>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Přiblížit">+</button>
        <button type="button" id="zout" aria-label="Oddálit">−</button>
        <button type="button" id="zfit" aria-label="Celá mapa">⤢</button>
      </div>
      <div class="maphint" id="maphint" hidden></div>
    </div>

    <div class="side">
      <!-- QUIZ (both modes) -->
      <section id="quiz" class="side">
        <div class="card">
          <div class="bar">
            <span>Pojem <b id="pos">1</b> / <b id="total">0</b></span>
            <span>Správně <b id="s-ok">0</b> · Špatně <b id="s-bad">0</b> · Nevím <b id="s-skip">0</b></span>
          </div>
          <div class="progress"><i id="bar"></i></div>
        </div>
        <div class="card" id="qcard">
          <span class="q-cat" id="qcat"></span>
          <p class="prompt" id="qprompt"></p>
          <form class="answer" id="qform" autocomplete="off">
            <input id="qinput" type="text" placeholder="Napiš název…" aria-label="Název" spellcheck="false" autocapitalize="sentences">
            <button class="btn primary" id="qconfirm" type="submit">Potvrdit</button>
          </form>
          <div class="feedback" id="qfb" hidden></div>
          <div class="nav">
            <button class="btn idk" id="qidk" type="button">Nevím</button>
            <button class="btn prev" id="qprev" type="button">← Předchozí</button>
            <button class="btn next" id="qnext" type="button">Další →</button>
          </div>
        </div>
        <div class="card done" id="qdone" hidden>
          <h2 id="done-score"></h2>
          <p id="done-text"></p>
          <div class="tools" style="justify-content:center">
            <button class="btn primary" id="qwrong" type="button">Zopakovat chybné</button>
            <button class="btn" id="qagain" type="button">Nové kolo</button>
          </div>
        </div>
        <div class="tools"><button class="btn" id="qrestart" type="button">Zamíchat a začít znovu</button></div>
      </section>

      <!-- OVERVIEW -->
      <section id="atlas" class="side" hidden>
        <div class="card">
          <p class="sel-name" id="sel-name">Vyber pojem</p>
          <span class="sel-cat" id="sel-cat">Klikni na název v seznamu a mapa ti ho ukáže.</span>
          <label class="toggle"><input type="checkbox" id="showall"> Ukázat na mapě všechny vybrané pojmy</label>
        </div>
        <div class="card">
          <input class="search" id="search" type="search" placeholder="Hledat pojem…" aria-label="Hledat pojem">
          <div class="list" id="list"></div>
        </div>
      </section>
    </div>
  </div>

  <footer class="sig">NKSK</footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const ITEMS = window.ITEMS, MW = window.MAP.w, MH = window.MAP.h;
  const CATS = [...new Set(ITEMS.map(i => i.c))];

  /* ---------- map viewer ---------- */
  const svg = $("svg"), box = $("mapbox");
  const img = $("mapimg"); img.setAttribute("width", MW); img.setAttribute("height", MH);
  let vb = { x: 0, y: 0, w: MW, h: MH };
  function aspect(){ const r = box.getBoundingClientRect(); return r.width / Math.max(1, r.height); }
  function apply(){ clampVB(); svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); scaleLabels(); }
  function clampVB(){
    const a = aspect();
    vb.h = vb.w / a;
    const maxW = Math.max(MW, MH * a) * 1.02;
    if (vb.w > maxW){ vb.w = maxW; vb.h = vb.w / a; }
    if (vb.w < 40){ vb.w = 40; vb.h = vb.w / a; }
    const padX = Math.max(0, (vb.w - MW) / 2), padY = Math.max(0, (vb.h - MH) / 2);
    vb.x = vb.w >= MW ? -padX : Math.min(Math.max(vb.x, 0), MW - vb.w);
    vb.y = vb.h >= MH ? -padY : Math.min(Math.max(vb.y, 0), MH - vb.h);
  }
  function fit(){ const a = aspect(); vb.w = Math.max(MW, MH * a); vb.h = vb.w / a; vb.x = 0; vb.y = 0; apply(); }
  function zoomAt(f, cx, cy){
    const nw = vb.w / f;
    vb.x = cx - (cx - vb.x) * (nw / vb.w); vb.y = cy - (cy - vb.y) * (nw / vb.w);
    vb.w = nw; apply();
  }
  function toMap(clientX, clientY){
    const r = svg.getBoundingClientRect();
    return { x: vb.x + (clientX - r.left) / r.width * vb.w, y: vb.y + (clientY - r.top) / r.height * vb.h };
  }
  let anim = null;
  function animateTo(t){
    cancelAnimationFrame(anim);
    const s = { ...vb }, t0 = performance.now(), dur = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 420;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      vb.x = s.x + (t.x - s.x) * e; vb.y = s.y + (t.y - s.y) * e; vb.w = s.w + (t.w - s.w) * e; apply();
      if (k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  function focusBox(b, minW){
    const a = aspect();
    let w = Math.max(b.w * 1.9, (b.h * 1.9) * a, minW || 260);
    w = Math.min(w, Math.max(MW, MH * a));
    animateTo({ x: b.x + b.w / 2 - w / 2, y: b.y + b.h / 2 - w / a / 2, w });
  }
  $("zin").onclick = () => zoomAt(1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
  $("zout").onclick = () => zoomAt(1 / 1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
  $("zfit").onclick = () => { cancelAnimationFrame(anim); fit(); };
  svg.addEventListener("wheel", e => { e.preventDefault(); const p = toMap(e.clientX, e.clientY); zoomAt(Math.exp(-e.deltaY * 0.0018), p.x, p.y); }, { passive: false });

  const pts = new Map(); let moved = 0, start = null, pinch = null;
  svg.addEventListener("pointerdown", e => {
    svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cancelAnimationFrame(anim);
    if (pts.size === 1){ moved = 0; start = { cx: e.clientX, cy: e.clientY, vx: vb.x, vy: vb.y }; }
    if (pts.size === 2){
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), w: vb.w, mid: toMap((a.x + b.x) / 2, (a.y + b.y) / 2) };
      moved = 99;
    }
  });
  svg.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = svg.getBoundingClientRect();
    if (pts.size === 1 && start){
      const dx = e.clientX - start.cx, dy = e.clientY - start.cy;
      moved = Math.max(moved, Math.hypot(dx, dy));
      if (moved > 5){ box.classList.add("dragging"); vb.x = start.vx - dx / r.width * vb.w; vb.y = start.vy - dy / r.height * vb.h; apply(); }
    } else if (pts.size === 2 && pinch){
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const nw = pinch.w * pinch.d / d;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      vb.w = nw; vb.h = nw / aspect();
      vb.x = pinch.mid.x - (mx - r.left) / r.width * vb.w;
      vb.y = pinch.mid.y - (my - r.top) / r.height * vb.h;
      apply();
    }
  });
  function endPtr(e){
    if (!pts.has(e.pointerId)) return;
    const wasSingle = pts.size === 1;
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 1){ const p = [...pts.values()][0]; start = { cx: p.x, cy: p.y, vx: vb.x, vy: vb.y }; }
    if (pts.size === 0){ box.classList.remove("dragging"); if (wasSingle && moved <= 5 && e.type === "pointerup") onMapClick(toMap(e.clientX, e.clientY)); start = null; }
  }
  svg.addEventListener("pointerup", endPtr);
  svg.addEventListener("pointercancel", endPtr);
  window.addEventListener("resize", () => apply());

  /* ---------- geometry ---------- */
  function bbox(g){
    let xs = [], ys = [];
    if (g.t === "poly") g.p.forEach(p => p.forEach(([x, y]) => { xs.push(x); ys.push(y); }));
    if (g.t === "line") g.p.forEach(([x, y]) => { xs.push(x); ys.push(y); });
    if (g.t === "pt") g.c.forEach(([x, y]) => { xs.push(x - g.r, x + g.r); ys.push(y - g.r, y + g.r); });
    const x = Math.min(...xs), y = Math.min(...ys);
    return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
  }
  function anchor(g){
    if (g.t === "pt") return g.c[0];
    if (g.t === "line") return g.p[Math.floor(g.p.length / 2)];
    const b = bbox(g); return [b.x + b.w / 2, b.y + b.h / 2];
  }
  function segDist(px, py, ax, ay, bx, by){
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  }
  function inPoly(x, y, p){
    let c = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++){
      const [xi, yi] = p[i], [xj, yj] = p[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  // distance from point to item shape (0 = inside)
  function dist(g, x, y){
    if (g.t === "pt") return Math.min(...g.c.map(([cx, cy]) => Math.max(0, Math.hypot(x - cx, y - cy) - g.r)));
    if (g.t === "line"){ let d = 1e9; for (let i = 1; i < g.p.length; i++) d = Math.min(d, segDist(x, y, ...g.p[i - 1], ...g.p[i])); return d; }
    let d = 1e9;
    for (const p of g.p){
      if (inPoly(x, y, p)) return 0;
      for (let i = 0; i < p.length; i++) d = Math.min(d, segDist(x, y, ...p[i], ...p[(i + 1) % p.length]));
    }
    return d;
  }

  /* ---------- drawing ---------- */
  function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function drawShape(g, parent, cls){
    const grp = el("g", { class: cls || "" }, parent);
    if (g.t === "poly") g.p.forEach(p => el("path", { d: "M" + p.map(q => q.join(",")).join("L") + "Z", class: "hl-poly" }, grp));
    if (g.t === "line") el("polyline", { points: g.p.map(q => q.join(",")).join(" "), class: "hl-line" }, grp);
    if (g.t === "pt") g.c.forEach(([x, y]) => {
      el("circle", { cx: x, cy: y, r: g.r, class: "hl-pt" }, grp);
      if (g.r < 20) el("circle", { cx: x, cy: y, r: Math.min(3.2, g.r * .45), class: "hl-dot" }, grp);
    });
    return grp;
  }
  const labelEls = [];
  function addLabel(text, x, y, parent){
    const t = el("text", { x, y, class: "lbl", "text-anchor": "middle", "dominant-baseline": "middle" }, parent);
    t.textContent = text; labelEls.push(t); return t;
  }
  function scaleLabels(){
    const r = svg.getBoundingClientRect(); const k = vb.w / Math.max(1, r.width);
    labelEls.forEach(t => { if (!t.isConnected) return; t.style.fontSize = (13 * k) + "px"; t.style.strokeWidth = (3.5 * k) + "px"; });
    document.querySelectorAll(".click-mark").forEach(c => c.setAttribute("r", 7 * k));
  }
  function clear(...ids){ ids.forEach(id => { $(id).innerHTML = ""; }); labelEls.length = 0; }

  /* ---------- categories ---------- */
  let active = new Set(CATS);
  try { const s = JSON.parse(localStorage.getItem("slepa-cats") || "null"); if (Array.isArray(s) && s.length) active = new Set(s.filter(c => CATS.includes(c))); } catch(e){}
  if (!active.size) active = new Set(CATS);
  function renderCats(){
    const c = $("cats"); c.innerHTML = "";
    const all = document.createElement("button"); all.type = "button"; all.className = "chip all";
    all.textContent = active.size === CATS.length ? "Vše ✓" : "Vybrat vše";
    all.onclick = () => { active = new Set(CATS); catsChanged(); };
    c.appendChild(all);
    CATS.forEach(cat => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", active.has(cat));
      b.textContent = cat + " " + ITEMS.filter(i => i.c === cat).length;
      b.onclick = () => {
        if (active.size === CATS.length){ active = new Set([cat]); }
        else if (active.has(cat)){ active.delete(cat); if (!active.size) active = new Set(CATS); }
        else active.add(cat);
        catsChanged();
      };
      c.appendChild(b);
    });
  }
  function pool(){ return ITEMS.filter(i => active.has(i.c)); }
  function catsChanged(){
    try { localStorage.setItem("slepa-cats", JSON.stringify([...active])); } catch(e){}
    renderCats();
    if (mode === "atlas") renderList(); else startQuiz(pool());
  }

  /* ---------- answer matching ---------- */
  const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
  const norm = s => s.toLowerCase().replace(/[.,]/g, " ").replace(/\bsv\b/g, "svatého").replace(/\s+/g, " ").trim();
  const GENERIC = /\b(oceán|moře|jezero|jezera|poušť|nížina|pohoří|ostrov|ostrovy|mys|řeka|poloostrov|přehrada)\b/g;
  const core = s => norm(s).replace(GENERIC, " ").replace(/\s+/g, " ").trim();
  function check(it, input){
    const a = norm(input); if (!a) return null;
    const names = [it.n, ...(it.a || [])];
    const forms = n => [norm(n), core(n)].filter(Boolean);
    const ac = core(input);
    if (names.some(n => forms(n).includes(a) || (ac && forms(n).includes(ac)))) return "ok";
    const sa = strip(a), sac = strip(ac);
    if (names.some(n => forms(n).map(strip).some(f => f === sa || (sac && f === sac)))) return "warn";
    return "bad";
  }

  /* ---------- quiz ---------- */
  let mode = "what", order = [], idx = 0, answers = [];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function startQuiz(list){
    order = shuffle(list); idx = 0; answers = order.map(() => null);
    $("qdone").hidden = true; $("qcard").hidden = false;
    renderQ(true);
  }
  function stats(){
    const c = { ok: 0, bad: 0, skip: 0 };
    answers.forEach(a => { if (!a) return; if (a.r === "ok" || a.r === "warn") c.ok++; else if (a.r === "bad") c.bad++; else c.skip++; });
    $("s-ok").textContent = c.ok; $("s-bad").textContent = c.bad; $("s-skip").textContent = c.skip;
    $("bar").style.width = (answers.filter(Boolean).length / Math.max(1, order.length) * 100) + "%";
  }
  function renderQ(refocus){
    const it = order[idx], st = answers[idx];
    $("total").textContent = order.length; $("pos").textContent = idx + 1; stats();
    clear("hl", "marks", "labels", "overlay");
    $("qcat").textContent = it.c;
    $("qprev").disabled = idx === 0;
    $("qnext").textContent = idx === order.length - 1 ? "Vyhodnotit →" : "Další →";
    $("qidk").disabled = !!st;
    const fb = $("qfb");
    if (mode === "what"){
      $("qform").hidden = false;
      $("qprompt").textContent = "Co je zvýrazněné na mapě?";
      $("qinput").value = st ? st.text : ""; $("qinput").disabled = !!st; $("qconfirm").disabled = !!st;
      drawShape(it.g, $("hl"), st && (st.r === "ok" || st.r === "warn") ? "ok" : "pulse");
      if (refocus !== false) focusBox(bbox(it.g), 420);
      $("maphint").hidden = true;
      if (!st && matchMedia("(hover:hover)").matches) $("qinput").focus({ preventScroll: true });
    } else {
      $("qform").hidden = true;
      $("qprompt").textContent = it.n;
      box.classList.toggle("picking", !st);
      $("maphint").hidden = !!st; $("maphint").textContent = "Klikni na mapu, kde to je";
      if (st){
        drawShape(it.g, $("hl"), st.r === "ok" ? "ok" : "");
        if (st.click){ const c = el("circle", { cx: st.click.x, cy: st.click.y, r: 7, class: "click-mark" + (st.r === "ok" ? " good" : "") }, $("marks")); }
        const [ax, ay] = anchor(it.g); addLabel(it.n, ax, ay - (it.g.t === "pt" ? it.g.r + 10 : 0), $("labels"));
        if (refocus !== false){
          const b = bbox(it.g);
          if (st.click){ const x0 = Math.min(b.x, st.click.x), y0 = Math.min(b.y, st.click.y); focusBox({ x: x0, y: y0, w: Math.max(b.x + b.w, st.click.x) - x0, h: Math.max(b.y + b.h, st.click.y) - y0 }, 260); }
          else focusBox(b, 260);
        }
      } else if (refocus !== false) { cancelAnimationFrame(anim); fit(); }
    }
    if (!st){ fb.hidden = true; scaleLabels(); return; }
    fb.hidden = false;
    const name = `<span class="correct">${it.n}</span>`;
    if (st.r === "ok") { fb.className = "feedback ok"; fb.innerHTML = mode === "what" ? "Správně!" + name : "Trefa!" + name; }
    else if (st.r === "warn") { fb.className = "feedback warn"; fb.innerHTML = "Správně, ale pozor na diakritiku:" + name; }
    else if (st.r === "bad") { fb.className = "feedback bad"; fb.innerHTML = mode === "what" ? "Špatně, je to:" + name : "Vedle. Správně je to zvýrazněné:" + name; }
    else { fb.className = "feedback bad"; fb.innerHTML = (mode === "what" ? "Tohle je:" : "Tady je:") + name; }
    scaleLabels();
    if (matchMedia("(hover:hover)").matches) $("qnext").focus({ preventScroll: true });
  }
  $("qform").addEventListener("submit", e => {
    e.preventDefault();
    if (answers[idx]) { next(); return; }
    const text = $("qinput").value, r = check(order[idx], text);
    if (!r) { $("qinput").focus(); return; }
    answers[idx] = { r, text }; renderQ(false);
  });
  function onMapClick(p){
    if (mode !== "find" || !order.length || answers[idx]) return;
    const it = order[idx];
    const tol = Math.max(8, vb.w * 0.012);
    const d = dist(it.g, p.x, p.y);
    answers[idx] = { r: d <= tol ? "ok" : "bad", click: p };
    renderQ(true);
  }
  $("qidk").onclick = () => { answers[idx] = { r: "skip", text: "" }; renderQ(true); };
  $("qprev").onclick = () => { if (idx > 0){ idx--; renderQ(true); } };
  $("qnext").onclick = next;
  function next(){ if (idx < order.length - 1){ idx++; renderQ(true); } else finish(); }
  function finish(){
    const ok = answers.filter(a => a && (a.r === "ok" || a.r === "warn")).length;
    const wrong = order.filter((it, i) => !answers[i] || !(answers[i].r === "ok" || answers[i].r === "warn"));
    $("qcard").hidden = true; $("qdone").hidden = false;
    $("done-score").textContent = ok + " / " + order.length;
    $("done-text").textContent = wrong.length ? `Ještě ${wrong.length} ${wrong.length < 5 ? "pojmy" : "pojmů"} k procvičení.` : "Všechno správně, mapa je tvoje!";
    $("qwrong").hidden = !wrong.length; $("qwrong").onclick = () => startQuiz(wrong);
    clear("hl", "marks", "labels"); $("maphint").hidden = true; box.classList.remove("picking"); fit();
  }
  $("qagain").onclick = () => startQuiz(pool());
  $("qrestart").onclick = () => startQuiz(pool());
  document.addEventListener("keydown", e => {
    if (mode === "atlas" || $("qcard").hidden) return;
    if (e.key === "Enter" && answers[idx] && document.activeElement !== $("qprev") && document.activeElement !== $("qnext")) { e.preventDefault(); next(); }
  });

  /* ---------- overview ---------- */
  let selected = null;
  function renderList(){
    const q = strip(norm($("search").value || ""));
    const list = $("list"); list.innerHTML = "";
    CATS.filter(c => active.has(c)).forEach(cat => {
      const its = ITEMS.filter(i => i.c === cat && (!q || strip(norm(i.n)).includes(q) || (i.a || []).some(a => strip(norm(a)).includes(q))));
      if (!its.length) return;
      const sec = document.createElement("div");
      sec.innerHTML = `<h3>${cat}</h3>`;
      const ul = document.createElement("ul");
      its.forEach(it => {
        const li = document.createElement("li"), b = document.createElement("button");
        b.type = "button"; b.textContent = it.n; b.setAttribute("aria-current", selected === it.id);
        b.onclick = () => select(it.id, true);
        li.appendChild(b); ul.appendChild(li);
      });
      sec.appendChild(ul); list.appendChild(sec);
    });
    drawOverview();
  }
  function drawOverview(){
    clear("overlay", "hl", "marks", "labels");
    if ($("showall").checked){
      ITEMS.filter(i => active.has(i.c)).forEach(it => {
        drawShape(it.g, $("overlay"), "ov-shape");
        const [ax, ay] = anchor(it.g); addLabel(it.n, ax, ay, $("labels"));
      });
    }
    if (selected !== null){
      const it = ITEMS[selected];
      drawShape(it.g, $("hl"), "pulse");
      if (!$("showall").checked){ const [ax, ay] = anchor(it.g); addLabel(it.n, ax, ay - (it.g.t === "pt" ? it.g.r + 10 : 0), $("labels")); }
    }
    scaleLabels();
  }
  function select(id, zoom){
    selected = id; const it = ITEMS[id];
    $("sel-name").textContent = it.n; $("sel-cat").textContent = it.c + (it.a && it.a.length ? " · také: " + it.a.filter(a => a !== it.n).slice(0, 2).join(", ") : "");
    document.querySelectorAll("#list button").forEach(b => b.setAttribute("aria-current", b.textContent === it.n));
    drawOverview();
    if (zoom){
      focusBox(bbox(it.g), 300);
      if (matchMedia("(max-width:900px)").matches) box.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  $("search").addEventListener("input", renderList);
  $("showall").addEventListener("change", drawOverview);

  /* ---------- tabs ---------- */
  function show(m){
    mode = m;
    ["what", "find", "atlas"].forEach(t => $("tab-" + t).setAttribute("aria-selected", t === m));
    $("quiz").hidden = m === "atlas"; $("atlas").hidden = m !== "atlas";
    box.classList.remove("picking"); $("maphint").hidden = true;
    if (m === "atlas"){ renderList(); cancelAnimationFrame(anim); fit(); }
    else startQuiz(pool());
  }
  $("tab-what").onclick = () => show("what");
  $("tab-find").onclick = () => show("find");
  $("tab-atlas").onclick = () => show("atlas");

  renderCats();
  requestAnimationFrame(() => { fit(); show("what"); });
})();
</script>
</body>
</html>
